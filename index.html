<script type="text/babel" data-type="module">
const { useState, useEffect, useRef, useMemo, Suspense } = React;
const { motion, AnimatePresence } = window.Motion || window.framerMotion || {};
const { Canvas, useFrame } = window.ReactThreeFiber || {};

/* ---------- Store (simple) ---------- */
const useAppStore = (() => {
  let state = {
    unlocked: false,
    favorites: [],
    listings: [],
    view: 'home',
  };
  const listeners = new Set();
  const set = (patch) => {
    state = { ...state, ...patch };
    listeners.forEach((l) => l(state));
  };
  return {
    get: () => state,
    subscribe: (fn) => { listeners.add(fn); return () => listeners.delete(fn); },
    unlock: () => set({ unlocked: true }),
    toggleFavorite: (id) => {
      const has = state.favorites.includes(id);
      set({ favorites: has ? state.favorites.filter((x) => x !== id) : [...state.favorites, id] });
    },
    setView: (v) => set({ view: v }),
    setListings: (l) => set({ listings: l }),
  };
})();

function useStore() {
  const [s, setS] = useState(useAppStore.get());
  useEffect(() => useAppStore.subscribe(setS), []);
  return s;
}

/* ---------- Custom Cursor ---------- */
function CustomCursor() {
  const dotRef = useRef(null);
  const ringRef = useRef(null);
  useEffect(() => {
    if (window.matchMedia('(hover: none)').matches) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const dot = dotRef.current, ring = ringRef.current;
    let mx = innerWidth / 2, my = innerHeight / 2, rx = mx, ry = my, raf;
    const move = (e) => {
      mx = e.clientX; my = e.clientY;
      dot.style.transform = `translate3d(${mx - 3}px, ${my - 3}px, 0)`;
    };
    const anim = () => {
      rx += (mx - rx) * 0.18; ry += (my - ry) * 0.18;
      ring.style.transform = `translate3d(${rx - 18}px, ${ry - 18}px, 0)`;
      raf = requestAnimationFrame(anim);
    };
    anim();
    const over = (e) => {
      if (e.target.closest('a, button, input, select, [data-cursor="hover"]')) {
        ring.style.width = '56px'; ring.style.height = '56px';
        ring.style.borderColor = 'rgba(255,138,50,0.9)';
      }
    };
    const out = () => {
      ring.style.width = '36px'; ring.style.height = '36px';
      ring.style.borderColor = 'rgba(255,138,50,0.5)';
    };
    addEventListener('mousemove', move);
    addEventListener('mouseover', over);
    addEventListener('mouseout', out);
    return () => {
      cancelAnimationFrame(raf);
      removeEventListener('mousemove', move);
      removeEventListener('mouseover', over);
      removeEventListener('mouseout', out);
    };
  }, []);
  return (
    <>
      <div ref={ringRef} className="pointer-events-none fixed left-0 top-0 z-[9999] hidden rounded-full border border-orange/50 transition-[width,height,border-color] duration-200 md:block" style={{ width: 36, height: 36, mixBlendMode: 'difference' }} />
      <div ref={dotRef} className="pointer-events-none fixed left-0 top-0 z-[9999] hidden h-1.5 w-1.5 rounded-full bg-orange md:block" />
    </>
  );
}

/* ---------- Password Gate (Pure CSS + SVG "fish" — no heavy 3D) ---------- */
function PasswordGate() {
  const [value, setValue] = useState('');
  const [error, setError] = useState(false);
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState(false);
  const CORRECT = '88888888';

  const submit = () => {
    if (loading) return;
    setError(false); setLoading(true);
    setTimeout(() => {
      if (value === CORRECT) {
        setSuccess(true);
        setTimeout(() => useAppStore.unlock(), 900);
      } else {
        setLoading(false); setError(true); setValue('');
        setTimeout(() => setError(false), 700);
      }
    }, 700);
  };

  return (
    <motion.div
      className="relative h-screen w-screen overflow-hidden"
      style={{ background: 'radial-gradient(ellipse at center, #0a1530 0%, #03040d 70%)' }}
      initial={{ opacity: 1 }}
      exit={{ opacity: 0, scale: 1.05, filter: 'blur(20px)' }}
      transition={{ duration: 0.9 }}
    >
      {/* Underwater scene: pure CSS/SVG (no WebGL) */}
      <UnderwaterFishScene />

      {/* Vignette */}
      <div className="pointer-events-none absolute inset-0" style={{ background: 'radial-gradient(ellipse at center, transparent 30%, #03040d 90%)' }} />

      <div className="relative z-10 flex h-full flex-col items-center justify-center px-6">
        <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.4, duration: 0.9 }} className="text-center">
          <p className="mb-2 text-xs tracking-[0.5em] text-orange/80">SECURE ACCESS</p>
          <h1 className="text-4xl font-black tracking-[0.25em] md:text-6xl">
            DOMORA <span className="text-gradient">ACCESS</span>
          </h1>
          <p className="mt-3 text-sm text-muted">Enter access code to unlock the experience</p>
        </motion.div>

        {!success ? (
          <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.7 }} className="mt-10 w-full max-w-sm">
            <div className={`glass rounded-2xl p-2 transition-shadow ${error ? 'shadow-[0_0_30px_rgba(255,60,60,0.6)]' : 'shadow-glow'}`}>
              <div className="flex items-center gap-2">
                <input
                  type="password"
                  inputMode="numeric"
                  autoFocus
                  value={value}
                  onChange={(e) => setValue(e.target.value.replace(/\D/g, ''))}
                  onKeyDown={(e) => e.key === 'Enter' && submit()}
                  placeholder="• • • • • • • •"
                  maxLength={8}
                  className={`w-full bg-transparent px-4 py-3 text-center text-lg tracking-[0.5em] text-white outline-none placeholder:text-white/20 ${error ? 'animate-shake' : ''}`}
                />
                <button onClick={submit} disabled={loading || !value} className="flex h-12 items-center justify-center rounded-xl bg-gradient-to-r from-orange to-gold px-5 font-semibold text-black transition-all hover:shadow-glow-sm disabled:opacity-40">
                  {loading ? <span className="h-5 w-5 animate-spin rounded-full border-2 border-black/30 border-t-black" /> : 'Unlock'}
                </button>
              </div>
            </div>
            {error && <p className="mt-3 text-center text-sm text-red-400">Noto'g'ri kod. Qayta urinib ko'ring.</p>}
            <p className="mt-4 text-center text-xs text-white/30">Demo access code: 88888888</p>
          </motion.div>
        ) : (
          <motion.div initial={{ opacity: 0, scale: 0.8 }} animate={{ opacity: 1, scale: 1 }} className="mt-10 text-center">
            <div className="mx-auto mb-3 h-12 w-12 rounded-full border-2 border-orange border-t-transparent animate-spin" />
            <p className="text-orange">Access granted. Welcome to DOMORA.</p>
          </motion.div>
        )}
      </div>
    </motion.div>
  );
}

/* Underwater scene with SVG fish + CSS particles */

  const bubbles = useMemo(() => Array.from({ length: 40 }, (_, i) => ({
    id: i,
    x: Math.random() * 100,
    size: 2 + Math.random() * 6,

            <path d="M 200 85 Q 210 120 200 155" />

/* ---------- 3D Villa (CSS-only stylized version) ---------- */
function VillaScene() {
  const wrapRef = useRef(null);
  useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    if (window.matchMedia('(hover: none)').matches) return;
    const onMove = (e) => {
      const rect = el.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      const inner = el.querySelector('.villa-3d');
      if (inner) inner.style.transform = `rotateY(${x * 15}deg) rotateX(${-y * 10}deg)`;
    };
    const onLeave = () => {
      const inner = el.querySelector('.villa-3d');
      if (inner) inner.style.transform = 'rotateY(0) rotateX(0)';
    };
    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseleave', onLeave);
    return () => { el.removeEventListener('mousemove', onMove); el.removeEventListener('mouseleave', onLeave); };
  }, []);

  return (
    <div ref={wrapRef} className="relative h-full w-full" style={{ perspective: 1200 }}>
      {/* Ambient glow */}
      <div className="pointer-events-none absolute inset-0" style={{ background: 'radial-gradient(ellipse at 60% 60%, rgba(255,138,50,0.25), transparent 60%)' }} />

      <div className="villa-3d relative mx-auto transition-transform duration-500 ease-out" style={{ transformStyle: 'preserve-3d', width: '100%', height: '100%', maxWidth: 560, marginTop: '10%' }}>
        <svg viewBox="0 0 560 420" className="w-full h-full" style={{ filter: 'drop-shadow(0 30px 60px rgba(255,138,50,0.25))' }}>
          <defs>
            <linearGradient id="villaBase" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor="#2a2a2a" />
              <stop offset="100%" stopColor="#0f0f0f" />
            </linearGradient>
            <linearGradient id="villaTop" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor="#3a3a3a" />
              <stop offset="100%" stopColor="#1a1a1a" />
            </linearGradient>
            <linearGradient id="windowGlow" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor="#ffd6a5" />
              <stop offset="100%" stopColor="#FF8A32" />
            </linearGradient>
            <linearGradient id="poolWater" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor="#1e6fbf" />
              <stop offset="100%" stopColor="#0a3b6b" />
            </linearGradient>
          </defs>

          {/* Ground */}
          <ellipse cx="280" cy="380" rx="260" ry="30" fill="#0a0a0a" />

          {/* Pool */}
          <ellipse cx="120" cy="350" rx="80" ry="22" fill="url(#poolWater)" opacity="0.9" />
          <ellipse cx="120" cy="350" rx="80" ry="22" fill="none" stroke="#3a8fd9" strokeWidth="1.5" opacity="0.7" />

          {/* Trees */}
          <g>
            <rect x="470" y="260" width="8" height="100" fill="#3a2b1a" />
            <ellipse cx="474" cy="250" rx="30" ry="55" fill="#1d4d2e" />
            <rect x="510" y="280" width="6" height="80" fill="#3a2b1a" />
            <ellipse cx="513" cy="270" rx="22" ry="40" fill="#1d4d2e" />
          </g>

          {/* Lower block */}
          <rect x="120" y="200" width="320" height="150" fill="url(#villaBase)" />
          {/* Upper block */}

}

          <VillaScene />

/* ---------- Properties Page (inline demo data) ---------- */
const DEMO_LISTINGS = [
  { id: 'p1', title: 'Zamonaviy luxury villa', region: 'Toshkent', price: 350000, type: 'VILLA', bedrooms: 5, bathrooms: 4, area: 420, img: 'https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=800&q=80' },
  { id: 'p2', title: 'Panoramali penthouse', region: 'Toshkent', price: 220000, type: 'PENTHOUSE', bedrooms: 3, bathrooms: 2, area: 180, img: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=800&q=80' },
  { id: 'p3', title: 'Tarixiy markazdagi hovli', region: 'Samarqand', price: 95000, type: 'HOUSE', bedrooms: 4, bathrooms: 2, area: 260, img: 'https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=800&q=80' },
  { id: 'p4', title: 'Bog‘li zamonaviy uy', region: 'Buxoro', price: 140000, type: 'HOUSE', bedrooms: 4, bathrooms: 3, area: 300, img: 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=800&q=80' },
  { id: 'p5', title: 'Shahar markazida kvartira', region: 'Toshkent', price: 78000, type: 'APARTMENT', bedrooms: 2, bathrooms: 1, area: 85, img: 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=800&q=80' },
  { id: 'p6', title: 'Hashamatli duplex', region: 'Toshkent', price: 410000, type: 'VILLA', bedrooms: 6, bathrooms: 5, area: 520, img: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&q=80' },
  { id: 'p7', title: 'Sokin mahalladagi uy', region: 'Namangan', price: 62000, type: 'HOUSE', bedrooms: 3, bathrooms: 2, area: 180, img: 'https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=800&q=80' },
  { id: 'p8', title: 'Biznes klass ofis', region: 'Toshkent', price: 180000, type: 'COMMERCIAL', bedrooms: 0, bathrooms: 2, area: 200, img: 'https://images.unsplash.com/photo-1497366216548-37526070297c?w=800&q=80' },
  { id: 'p9', title: 'Komfort kvartira', region: 'Farg‘ona', price: 55000, type: 'APARTMENT', bedrooms: 2, bathrooms: 1, area: 72, img: 'https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=800&q=80' },
];

function PropertiesPage() {
  const s = useStore();
  const [query, setQuery] = useState('');
  const [typeFilter, setTypeFilter] = useState('ALL');

  const filtered = DEMO_LISTINGS.filter((p) => {
    const matchesQ = p.title.toLowerCase().includes(query.toLowerCase()) || p.region.toLowerCase().includes(query.toLowerCase());
    const matchesT = typeFilter === 'ALL' || p.type === typeFilter;
    return matchesQ && matchesT;
  });

  return (
    <main className="mx-auto max-w-7xl px-6 pt-32 pb-20">
      <h1 className="mb-2 text-4xl font-black">Properties</h1>
      <p className="mb-8 text-muted">Barcha e'lonlar — demo ma'lumotlar (backend'siz).</p>

      <div className="mb-8 flex flex-wrap gap-3">
        <input
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          placeholder="Qidirish: nom yoki shahar…"
          className="glass flex-1 rounded-xl px-4 py-3 text-sm text-white outline-none placeholder:text-white/30"
        />
        <select value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)} className="glass rounded-xl px-4 py-3 text-sm text-white outline-none">
          <option value="ALL" className="bg-black">Barcha turlar</option>
          <option value="APARTMENT" className="bg-black">Apartment</option>
          <option value="VILLA" className="bg-black">Villa</option>
          <option value="HOUSE" className="bg-black">House</option>
          <option value="PENTHOUSE" className="bg-black">Penthouse</option>
          <option value="COMMERCIAL" className="bg-black">Commercial</option>
        </select>
      </div>

      <div className="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
        {filtered.map((p) => {
          const isFav = s.favorites.includes(p.id);
          return (
            <motion.div key={p.id} initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} className="glass group overflow-hidden rounded-2xl">
              <div className="relative h-56 overflow-hidden">
                <img src={p.img} alt={p.title} className="h-full w-full object-cover transition-transform duration-700 group-hover:scale-110" loading="lazy" />
                <button onClick={() => useAppStore.toggleFavorite(p.id)} className="absolute right-3 top-3 rounded-full bg-black/50 p-2 text-lg backdrop-blur hover:scale-110 transition-transform">
                  {isFav ? '♥' : '♡'}
                </button>
                <span className="absolute left-3 top-3 rounded-full bg-orange px-3 py-1 text-xs font-semibold text-black">{p.type}</span>
              </div>
              <div className="p-5">
                <h3 className="truncate text-lg font-semibold">{p.title}</h3>
                <p className="mt-1 text-sm text-muted">{p.region}</p>
                <p className="mt-3 text-xl font-bold text-orange">${p.price.toLocaleString()}</p>
                <div className="mt-3 flex gap-4 text-xs text-muted">
                  <span>{p.bedrooms} 🛏</span>
                  <span>{p.bathrooms} 🛁</span>
                  <span>{p.area} m²</span>
                </div>
              </div>
            </motion.div>
          );
        })}
      </div>
    </main>
  );
}

/* ---------- App ---------- */
function App() {
  const s = useStore();
  return (
    <>
      <CustomCursor />
      <AnimatePresence mode="wait">
        {!s.unlocked ? (
          <PasswordGate key="gate" />
        ) : (
          <motion.div key="app" initial={{ opacity: 0, y: 24 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8 }} className="min-h-screen bg-bg text-ink">
            <Navbar onNav={(v) => useAppStore.setView(v)} />
            {s.view === 'home' && <HomePage onNav={(v) => useAppStore.setView(v)} />}
            {s.view === 'properties' && <PropertiesPage />}
          </motion.div>
        )}
      </AnimatePresence>
    </>
  );
}

/* ---------- Mount ---------- */
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
